<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Ucapan Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="guestbook">
        <h2>Kirim Doa & Ucapan</h2>
        
        <!-- Form diset ke HTML5 tanpa action bawaan -->
        <form id="guestbook-form">
            <input type="text" name="nama" placeholder="Nama Anda" required aria-required="true" class="form-input"/>
            
            <select name="kehadiran" required aria-label="Konfirmasi Kehadiran" class="form-input">
                <option value="Hadir">Hadir</option>
                <option value="Tidak Hadir">Tidak Hadir</option>
            </select>
            
            <textarea name="pesan" placeholder="Tulis ucapan dan doa..." required aria-label="Pesan" class="form-input"></textarea>
            
            <button type="submit" id="submit-btn">Kirim Ucapan</button>
        </form>

        <!-- Area target untuk merender kartu ucapan -->
        <div id="guestbook-feed-container" class="feed-container">
            <p>Memuat ucapan...</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
